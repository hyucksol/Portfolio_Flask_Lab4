<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %} 🌾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="menu">

        {% block tabs %}
        <!-- NAV BAR -->
        <nav class="tabs">
            <a class="tab {{ 'active' if request.endpoint == 'home' }}" href="{{ url_for('home') }}"><span class="ico">🏠</span>Home</a>
            <a class="tab {{ 'active' if request.endpoint == 'profile' }}" href="{{ url_for('profile') }}"><span class="ico">🧑‍🌾</span>Profile</a>
            <a class="tab {{ 'active' if request.endpoint == 'contact' }}" href="{{ url_for('contact') }}"><span class="ico">✉️</span>Contact</a>
            <a class="tab {{ 'active' if (request.endpoint or '').startswith('works') }}" href="{{ url_for('works') }}"><span class="ico">🔨</span>Works</a>
        </nav>
        {% endblock %}

        <main class="{% block main_class %}book{% endblock %}">
            {% block content %}{% endblock %}
        </main>

    </div>

    {% block footer %}
    <footer>🌾 Made with love in the valley 🌾</footer>
    {% endblock %}
</body>
</html>
