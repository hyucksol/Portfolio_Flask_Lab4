<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %} | Dhenz's Portfolio 🌻🐱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&family=Patrick+Hand&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">🌻 Home</a>
        <a href="{{ url_for('profile') }}">🐱 Profile</a>
        <a href="{{ url_for('contact') }}">💌 Contact</a>
        <a href="{{ url_for('works') }}">🧮 Works</a>
    </nav>

    <main class="xp-wrap">
        <div class="xp-window">
            <div class="xp-titlebar">
                <span class="dots"><i></i><i></i><i></i></span>
                <span class="xp-title">{% block window_title %}MY PORTFOLIO{% endblock %}</span>
            </div>
            <div class="lace"></div>
            <div class="xp-body">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

</body>
</html>
