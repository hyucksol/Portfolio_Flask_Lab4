{% extends 'base.html' %}
{% block title %}Messages{% endblock %}
{% block content %}
<div class="center"><div class="scroll">Messages ({{ rows|length }})</div></div>
{% for m in rows %}
<div class="box">
    <h3>{{ m.name }} <small class="cx">&lt;{{ m.email }}&gt; · {{ m.created }}</small></h3>
    <p style="white-space: pre-wrap">{{ m.body }}</p>
    <a href="mailto:{{ m.email }}?subject=Re: your message">Reply</a>
</div>
{% else %}
<p class="subtitle">No messages yet.</p>
{% endfor %}
{% endblock %}
