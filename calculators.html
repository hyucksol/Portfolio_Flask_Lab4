{% extends 'base.html' %}
{% block content %}
    <h2>📐 Area Calculators</h2>

    <h3>🌻 1. Area of Circle</h3>
    <form method="POST">
        <input type="hidden" name="form_type" value="circle">
        <label>Enter Radius:</label>
        <input type="number" step="any" name="radius" placeholder="e.g. 5" required>
        <button type="submit">Calculate Circle Area 🐾</button>
    </form>
    {% if circle_area is not none %}
        <p><strong>Result:</strong> <span class="badge">{{ circle_area }} sq units</span></p>
    {% endif %}

    <hr style="border: 1px dashed #c8e6c9; margin: 25px 0;">

    <h3>🐱 2. Area of Triangle</h3>
    <form method="POST">
        <input type="hidden" name="form_type" value="triangle">
        <label>Enter Base:</label>
        <input type="number" step="any" name="base" placeholder="e.g. 10" required>
        <label>Enter Height:</label>
        <input type="number" step="any" name="height" placeholder="e.g. 8" required>
        <button type="submit">Calculate Triangle Area 🐾</button>
    </form>
    {% if triangle_area is not none %}
        <p><strong>Result:</strong> <span class="badge">{{ triangle_area }} sq units</span></p>
    {% endif %}
{% endblock %}
